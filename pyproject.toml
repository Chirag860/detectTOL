[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detecttol"
version = "0.1.0.dev0"
description = "Verifiable mechanical tolerance stack-up analysis (worst case, RSS, Monte Carlo)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chirag" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6,<3",
    "typer>=0.12",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "pytest-cov>=5",
    "jsonschema>=4.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit",
]
# Reading SolidWorks files drives a locally installed, licensed SolidWorks (Windows only).
solidworks = ["pywin32>=306; sys_platform == 'win32'"]
# The local browser app (`detecttol app`).
app = ["nicegui>=4.0"]

[project.scripts]
detecttol = "detecttol.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detecttol = ["py.typed", "report/schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "solidworks: needs a licensed SOLIDWORKS 2026 and pywin32; runs only with DETECTTOL_SOLIDWORKS=1",
]

[tool.coverage.run]
source = ["detecttol"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tools/solidworks_spike"]  # throwaway feasibility scripts, see its README

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "T20"]
ignore = [
    "RUF001", # Greek letters and math symbols are intentional in docstrings
    "RUF002",
    "RUF003",
    "N803",   # math notation in argument names
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"src/detecttol/cli/*" = ["B008"] # typer uses function calls in defaults
"src/detecttol/report/render.py" = ["E501"] # report templates have long table rows
"src/detecttol/app/ui.py" = ["E501"] # page layout: long UI strings and class lists
"tests/*" = ["B008"] # hypothesis strategies as argument defaults
"validation/*" = ["T201"] # stand-alone scripts report on stdout

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/detecttol/core"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
