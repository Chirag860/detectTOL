name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast job: proves core/ and the CLI work without any CAD dependency.
  core-pip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=detecttol --cov-report=term --tb=short
      - run: detecttol analyze examples/golden_case_a.yaml --format json

  # Full environment from environment.yml (includes pythonocc-core).
  conda:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: detecttol
      - run: pytest --tb=short
      - run: detecttol analyze examples/golden_case_a.yaml --format md
