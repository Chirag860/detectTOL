# Run-time environment for engineers using the detectTOL app (no developer tools).
# The installer creates it with:  conda env create -n detecttol -f installer/environment-app.yml
# and then installs detectTOL itself from this folder with pip.
name: detecttol
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.11
  - pydantic>=2.6,<3
  - typer>=0.12
  - matplotlib-base>=3.8
  - jinja2>=3.1
  - pyyaml>=6.0
  - pythonocc-core>=8.0.1
  - nicegui>=4.0
  - pywin32          # Windows: reading SolidWorks files through SolidWorks
  - pillow           # the shortcut icon
  - pip
